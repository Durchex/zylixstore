# Render Blueprint for Zylixstore (zylix-main's apps/web UI, served standalone).
#
# This is a pure frontend: it proxies /api/* requests to a separately
# deployed Zylix API (apps/api from the zylix-main repo — see that repo's
# own render.yaml to deploy it). After importing this blueprint, set
# API_URL in the web service's Environment tab to that API's URL.
#
# Import: Render dashboard -> New -> Blueprint -> select this repo.

services:
  - type: web
    name: zylixstore
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Set this to your deployed Zylix API's base URL (e.g.
      # https://zylix-api.onrender.com) once it's live.
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
